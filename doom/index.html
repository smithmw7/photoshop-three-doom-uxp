<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Three.js Doom UXP Benchmark</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; touch-action: none; }
  #container { position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #benchmarkHud {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 1000;
    min-width: 170px;
    padding: 7px 9px;
    color: #e9f7ef;
    background: rgba(0, 0, 0, 0.78);
    border: 1px solid #44765a;
    font: 12px/1.4 monospace;
    pointer-events: none;
    white-space: pre;
  }
  #texturePicker[hidden] { display: none; }
  #texturePicker {
    position: fixed;
    inset: 12px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    color: #f5f5f5;
    background: rgba(17, 19, 21, 0.98);
    border: 2px solid #b2a36a;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    touch-action: pan-y;
  }
  .texture-picker-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
    min-height: 48px;
    padding: 8px 10px;
    background: #27292b;
    border-bottom: 1px solid #66604b;
  }
  .texture-picker-header h2 {
    margin: 0;
    color: #f1d778;
    font: bold 16px/1 monospace;
    letter-spacing: 0.06em;
  }
  #texturePickerCount {
    flex: 1 1 auto;
    color: #bbb;
    font: 12px/1 monospace;
  }
  #texturePickerClose {
    min-height: 30px;
    padding: 5px 12px;
    color: #fff;
    background: #414448;
    border: 1px solid #777;
    font: bold 12px/1 monospace;
  }
  #textureGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px;
    flex: 1 1 auto;
    min-height: 0;
    padding: 12px;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .texture-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 132px;
    padding: 5px;
    color: #eee;
    background: #25282b;
    border: 2px solid #4a4d50;
    font: 11px/1.2 monospace;
    text-align: left;
  }
  .texture-card:hover,
  .texture-card:focus {
    border-color: #d2bd67;
    outline: none;
  }
  .texture-card.is-selected {
    color: #fff7d2;
    background: #4a4124;
    border-color: #f1d778;
  }
  .texture-card.is-off-map:not(.is-selected) {
    color: #aaa;
    background: #202225;
    border-color: #383b3e;
    opacity: 0.72;
  }
  .texture-preview {
    display: block;
    width: 100%;
    height: 86px;
    background: #070707;
    image-rendering: pixelated;
    object-fit: contain;
  }
  .texture-card-copy {
    display: block;
    margin-top: 5px;
    overflow: hidden;
  }
  .texture-card-name {
    display: block;
    overflow: hidden;
    font-weight: bold;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .texture-card-size {
    display: block;
    margin-top: 1px;
    color: #aaa;
    font-size: 9px;
  }
</style>
</head>
<body>
<div id="container"></div>
<canvas id="overlay"></canvas>
<div id="benchmarkHud">Starting Three Doom…</div>
<section id="texturePicker" aria-label="Select a Doom wall texture" hidden>
  <header class="texture-picker-header">
    <h2>SELECT WALL TEXTURE</h2>
    <span id="texturePickerCount">Loading…</span>
    <button id="texturePickerClose" type="button">Close</button>
  </header>
  <div id="textureGrid" role="list"></div>
</section>
<script src="./benchmark.js"></script>
<script src="./doom.bundle.js"></script>
</body>
</html>
